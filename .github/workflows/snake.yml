# ═══════════════════════════════════════════════════════════════════════
#  Generates the animated "snake" that eats your GitHub contribution grid.
#
#  WHERE THIS FILE GOES:
#    .github/workflows/snake.yml       (inside the SajidurCodes/SajidurCodes repo)
#
#  ONE-TIME SETUP — the workflow WILL FAIL without this:
#    1. Repo Settings → Actions → General
#    2. Scroll to "Workflow permissions"
#    3. Select "Read and write permissions" → Save
#    4. Actions tab → "Generate Snake Animation" → "Run workflow"
#
#  It then re-runs every 12 hours on its own, so the snake stays current.
#  Output lands on a branch called `output`, which the README reads from.
# ═══════════════════════════════════════════════════════════════════════

name: Generate Snake Animation

on:
  schedule:
    # Every 12 hours. GitHub queues scheduled jobs, so exact timing varies.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Required so the action can push the generated SVGs to the output branch.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake from contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: SajidurCodes
          outputs: |
            dist/snake.svg?color_snake=%2300F5A0&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353
            dist/snake-dark.svg?palette=github-dark&color_snake=%2300F5A0
            dist/snake.gif?color_snake=%2300F5A0&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
